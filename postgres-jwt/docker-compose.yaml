services:
  server:
    build:
      context: .
    environment:
      - POSTGRES_PASSWORD=bureck
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:bureck@internal.docker.host:5432/user-auth
    ports:
      - 4001:4001
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    

  db:
    image: postgres:17.5-alpine3.22
    restart: always
    user: postgres
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_PASSWORD=bureck
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

